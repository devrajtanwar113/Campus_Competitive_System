
# ==================================
# SERVER CONFIGURATION
# ==================================

server.port=${PORT:8080}

# ==================================
# DATABASE CONFIGURATION
# ==================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/campusdb;DB_CLOSE_ON_EXIT=FALSE}

spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ==================================
# JPA CONFIGURATION
# ==================================

spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

# ==================================
# H2 CONSOLE
# ==================================

spring.h2.console.enabled=true

spring.h2.console.path=/h2-console

# ==================================
# JWT CONFIGURATION
# ==================================

jwt.secret=${JWT_SECRET:ThisIsAVerySecretKeyForCampusCompetitiveLearningSystem2026}

jwt.expiration=${JWT_EXPIRATION:86400000}
